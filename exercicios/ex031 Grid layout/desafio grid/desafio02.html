<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Area</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        body {
            width: 90vw;
            height: 90vh;
            display: grid;
            grid-template: 2fr 6fr 1fr / 1fr;
        }

        header, main, footer {
            border: 2px dashed red;
            text-align: center;
        }

        header {
            display: grid;
            grid-template: 2fr 1fr / 1fr 3fr 1fr;
            gap: 5px;
        }

        main {
            display: grid;
            grid-template: 1fr / 4fr 8fr  4fr;
            gap: 5px;
        }

        footer {
            display: grid;
            grid-template: 1fr / 1fr 3fr 1fr;
            gap: 5px;
        }

        h1 {
            background-color: lightblue;
            grid-area: 1 / 1 / 2 / -1;
        }

        nav {
            background-color: lightcoral;
            grid-area: 2 / 1 / 3 / -1;
        }

        .section1 {
            background-color: aquamarine;
            grid-area: 1 / 1 / 2 / 3;
        }

        .section2 {
            background-color: lightgreen;
            grid-area: 1 / 3 / 2 / -1;
        }

        p {
            background-color: lightslategrey;
            grid-area: 1 / 1 / 2 / -1;
        }

    </style>
</head>
<body>
    <header>
        <h1>Topo</h1>
        <nav>Menu</nav>
    </header>
    <main>
        <section class="section1">
            Principal
        </section>
        <section class="section2">
            Secundario
        </section>
    </main>
    <footer>
        <p>Rodape</p>
    </footer>
</body>
</html>
