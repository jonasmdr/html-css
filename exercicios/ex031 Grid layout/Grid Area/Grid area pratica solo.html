<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid area</title>
    <style>
        .container {
            border: 2px solid blue;
            width: 400px;
            height: 400px;
            display: grid;
            gap: 2px;
            grid-template: repeat(3, 1fr) / repeat(4,1fr);
        }

        .item {
            border: 2px solid red;
        }

        #e {
            grid-row-start: 2;
            grid-row-end: 4;

            grid-column-start: 1;
            grid-column-end: 3;
        }

        #f {
            grid-row-start: 2;
            grid-row-end: 4;

            grid-column-start: 3;
            grid-column-end: 5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div id="e" class="item">E</div>
        <div id="f" class="item">F</div>
    </div>
</body>
</html>
