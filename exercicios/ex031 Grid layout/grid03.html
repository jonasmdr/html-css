<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na prática</title>
    <style>
        div.container {
            border: 3px solid blue;
            display: grid;
            grid-template-rows: repeat(3, 80px);
            grid-template-columns: 100px 20% 2fr;
            grid-auto-flow: column; /* Serve para dizer pra onde vai quebrar o próximo item, por padrão vem row isso no caso de grid inplicito, que é quando é adicionado outro item além do que foi definido na grade */
            grid-auto-columns: 120px;
            grid-auto-rows: 80px;
            gap: 10px;
            place-items: normal;
            place-content: normal;
        }

        div.item {
            border: 3px solid red;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <div class="item">J</div>
    </div>
</body>
</html>
